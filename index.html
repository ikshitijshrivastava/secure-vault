<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f3a5f">
  <title>Secure Document Vault</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header id="topbar" class="hidden">
  <h1>Document Vault</h1>
  <button id="btn-lock" class="ghost">Lock</button>
</header>

<main>
  <!-- First-run setup -->
  <section id="view-setup" class="view hidden">
    <h2>Create your vault</h2>
    <p class="warn">Choose a master password. If you forget it, your data cannot be recovered.</p>
    <form id="form-setup">
      <label>Master password
        <input type="password" id="setup-pass" autocomplete="new-password" required minlength="8">
      </label>
      <label>Confirm password
        <input type="password" id="setup-pass2" autocomplete="new-password" required minlength="8">
      </label>
      <button type="submit">Create vault</button>
    </form>
  </section>

  <!-- Unlock -->
  <section id="view-unlock" class="view hidden">
    <h2>Unlock</h2>
    <form id="form-unlock">
      <label>Master password
        <input type="password" id="unlock-pass" autocomplete="current-password" required>
      </label>
      <button type="submit">Unlock</button>
    </form>
    <p id="unlock-error" class="error hidden"></p>
  </section>

  <!-- Document list -->
  <section id="view-list" class="view hidden">
    <div id="alerts"></div>
    <div class="toolbar">
      <input type="search" id="search" placeholder="Search documents">
      <button id="btn-add">+ Add</button>
    </div>
    <ul id="doc-list"></ul>
    <p id="empty-msg" class="hint hidden">No documents yet. Tap + Add.</p>

    <details class="backup">
      <summary>Backup, transfer and settings</summary>
      <div class="row">
        <button id="btn-export">Export vault (.vault)</button>
        <label class="file-btn">Import vault
          <input type="file" id="import-file" accept=".vault,application/json" hidden>
        </label>
      </div>
      <div class="row">
        <button id="btn-notify" class="ghost">Enable renewal notifications</button>
        <button id="btn-wipe" class="danger">Delete everything on this device</button>
      </div>
    </details>
  </section>

  <!-- Add / edit form -->
  <section id="view-edit" class="view hidden">
    <h2 id="edit-title">Add document</h2>
    <form id="form-doc">
      <label>Title
        <input id="f-title" required>
      </label>
      <label>Type
        <select id="f-type">
          <option>Identity</option>
          <option>Certificate</option>
          <option>Insurance</option>
          <option>Financial</option>
          <option>Vehicle</option>
          <option>Property</option>
          <option>Other</option>
        </select>
      </label>
      <label>Document number
        <input id="f-number">
      </label>
      <label>Issue date
        <input type="date" id="f-issue">
      </label>
      <label>Expiry date
        <input type="date" id="f-expiry">
      </label>
      <label>Notes
        <textarea id="f-notes" rows="3"></textarea>
      </label>
      <label>File (PDF or image)
        <input type="file" id="f-file" accept="image/*,application/pdf">
      </label>
      <p id="ocr-status" class="hint"></p>
      <div class="row">
        <button type="submit">Save</button>
        <button type="button" id="btn-cancel" class="ghost">Cancel</button>
      </div>
    </form>
  </section>

  <!-- Document detail -->
  <section id="view-detail" class="view hidden">
    <div id="detail"></div>
    <div class="row">
      <button id="btn-back" class="ghost">Back</button>
      <button id="btn-edit">Edit</button>
      <button id="btn-download">Open file</button>
      <button id="btn-delete" class="danger">Delete</button>
    </div>
  </section>
</main>

<script src="app.js" defer></script> 
  <script src="picker.js" defer></script>
  <script src="vault2.js" defer></script>
  <script src="vault2-ui.js" defer></script>
  <script src="smart.js" defer></script>
<script src="ui.js" defer></script>
  <script src="issuer.js" defer></script>
  <script src="issuer2.js" defer></script>
<script src="docs2.js" defer></script>
<script src="backup.js" defer></script>
<script src="profile-click.js" defer></script>
<script src="nav.js" defer></script>
<script src="passwords.js" defer></script>
</body>
    </html>
